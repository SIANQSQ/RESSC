; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32s3_uart

[env:4d_systems_esp32s3_gen4_r8n16]
platform = espressif32
board = 4d_systems_esp32s3_gen4_r8n16
framework = arduino
monitor_speed = 115200
monitor_eol = LF

; Use this environment when connected through the board's USB-to-UART port.
; The original environment above uses native USB CDC.
[env:esp32s3_uart]
extends = env:4d_systems_esp32s3_gen4_r8n16
build_unflags = -DARDUINO_USB_CDC_ON_BOOT=1
build_flags = -DARDUINO_USB_CDC_ON_BOOT=0
upload_port = COM10
monitor_port = COM10
